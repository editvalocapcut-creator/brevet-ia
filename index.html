<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brevet IA Révision</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f5f7fb; color: #333; }
        h1 { color: #2c3e50; text-align: center; }
        .matieres-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        button { padding: 15px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, background 0.2s; font-weight: bold; }
        button:hover { transform: translateY(-2px); }
        .btn-histoire { background: #e74c3c; color: white; }
        .btn-sciences { background: #2ecc71; color: white; }
        .btn-maths { background: #3498db; color: white; }
        .btn-francais { background: #9b59b6; color: white; }
        .btn-action { background: #2c3e50; color: white; width: 100%; margin-top: 10px; }
        .box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; border: 1px solid #ddd; border-radius: 6px; padding: 10px; resize: vertical; box-sizing: border-box; }
        .hidden { display: none; }
        .note-badge { font-size: 20px; font-weight: bold; color: #e67e22; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🚀 Préparation au Brevet avec l'IA</h1>

    <div class="box">
        <h3>1. Choisis ta matière de révision :</h3>
        <div class="matieres-container">
            <button class="btn-histoire" onclick="selectSubject('histoire')">🌍 Histoire-Géo / EMC</button>
            <button class="btn-sciences" onclick="selectSubject('sciences')">🧪 Sciences</button>
            <button class="btn-maths" onclick="selectSubject('maths')">📐 Mathématiques</button>
            <button class="btn-francais" onclick="selectSubject('francais')">📝 Français</button>
        </div>
        
        <div id="format-selection" class="hidden">
            <h3>2. Choisis le format de l'exercice :</h3>
            <select id="exercise-format" style="width: 100%; padding: 10px; border-radius: 6px;">
                <option value="courte">Question Flash (Rapide)</option>
                <option value="longue">Sujet Type Brevet (Développé)</option>
            </select>
            <button class="btn-action" onclick="generateQuestion()">✨ Générer l'exercice</button>
        </div>
    </div>

    <div id="exercise-box" class="box hidden">
        <h3>📋 Énoncé de l'exercice :</h3>
        <p id="question-text" style="font-size: 16px; line-height: 1.5; background: #f9f9f9; padding: 15px; border-left: 5px solid #2c3e50;"></p>
        
        <h3>✍️ Ta réponse :</h3>
        <textarea id="user-answer" placeholder="Rédige ta réponse ici de la manière la plus complète possible..."></textarea>
        <button class="btn-action" onclick="submitAnswer()">✔️ Envoyer pour correction</button>
    </div>

    <div id="correction-box" class="box hidden">
        <h3>🧐 Correction du Professeur IA :</h3>
        <p id="correction-text" style="white-space: pre-wrap; line-height: 1.6;"></p>
    </div>

    <script>
        let currentSubject = '';

        function selectSubject(subject) {
            currentSubject = subject;
            document.getElementById('format-selection').classList.remove('hidden');
            document.getElementById('exercise-box').classList.add('hidden');
            document.getElementById('correction-box').classList.add('hidden');
            
            // Effets visuels de sélection active si nécessaire
            console.log("Matière sélectionnée : " + subject);
        }

        async function generateQuestion() {
            const format = document.getElementById('exercise-format').value;
            document.getElementById('exercise-box').classList.remove('hidden');
            document.getElementById('question-text').innerText = "Génération de l'exercice en cours par l'IA...";
            document.getElementById('user-answer').value = '';
            document.getElementById('correction-box').classList.add('hidden');

            try {
                const response = await fetch('/api/grok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'generate', subject: currentSubject, format: format })
                });
                const data = await response.json();
                if (data.error) {
                    document.getElementById('question-text').innerText = "Erreur : " + data.error;
                } else {
                    document.getElementById('question-text').innerText = data.question;
                }
            } catch (err) {
                document.getElementById('question-text').innerText = "Erreur de connexion au serveur.";
            }
        }

        async function submitAnswer() {
            const answer = document.getElementById('user-answer').value;
            const question = document.getElementById('question-text').innerText;
            const format = document.getElementById('exercise-format').value;

            if(!answer.trim()) {
                alert("N'oublie pas de rédiger une réponse avant d'envoyer !");
                return;
            }

            document.getElementById('correction-box').classList.remove('hidden');
            document.getElementById('correction-text').innerText = "Le professeur corrige ta copie, patiente un instant...";

            try {
                const response = await fetch('/api/grok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'correct', 
                        subject: currentSubject, 
                        format: format, 
                        question: question, 
                        userAnswer: answer 
                    })
                });
                const data = await response.json();
                if (data.error) {
                    document.getElementById('correction-text').innerText = "Erreur pendant la correction : " + data.error;
                } else {
                    document.getElementById('correction-text').innerText = data.correction;
                    
                    // Optionnel : Extraction de la note pour envoi à Supabase
                    const noteMatch = data.correction.match(/Note\s*:\s*(\d+)\/5/i);
                    if (noteMatch && noteMatch[1]) {
                        saveNoteToSupabase(currentSubject, parseInt(noteMatch[1]));
                    }
                }
            } catch (err) {
                document.getElementById('correction-text').innerText = "Impossible de joindre le service de correction.";
            }
        }

        async function saveNoteToSupabase(subject, note) {
            try {
                await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subject: subject, note: note })
                });
                console.log(`Note de ${note}/5 enregistrée en ${subject} !`);
            } catch (e) {
                console.error("Échec de la sauvegarde de la note dans Supabase");
            }
        }
    </script>
</body>
</html>
