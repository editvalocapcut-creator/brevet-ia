<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révisions Brevet IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎓 Assistant Révisions Brevet</h1>
        <p class="subtitle">Prépare ton examen avec l'aide d'une IA</p>

        <div class="setup-box">
            <div class="form-group">
                <label for="subject-select">Choisis ta matière :</label>
                <select id="subject-select">
                    <option value="Histoire">Histoire</option>
                    <option value="Géographie">Géographie</option>
                    <option value="EMC">Enseignement Moral et Civique (EMC)</option>
                    <option value="Sciences">Sciences (Physique/SVT/Techno)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="format-select">Format des questions :</label>
                <select id="format-select">
                    <option value="courte">Questions courtes (Flashcards / Quiz rapide)</option>
                    <option value="longue">Questions détaillées (Développement rédigé)</option>
                </select>
            </div>

            <button id="start-btn">Générer une question</button>
        </div>

        <div id="quiz-box" class="quiz-box hidden">
            <div class="question-container">
                <h3>Question :</h3>
                <p id="question-text">Chargement de la question...</p>
            </div>

            <div class="form-group">
                <label for="user-answer">Ta réponse :</label>
                <textarea id="user-answer" placeholder="Rédige ta réponse ici..."></textarea>
            </div>

            <button id="submit-btn">Corriger ma réponse</button>

            <div id="correction-box" class="correction-box hidden">
                <h3>📜 Correction de l'IA :</h3>
                <div id="correction-text"></div>
                <button id="next-btn">Question suivante</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
